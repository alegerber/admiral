services:
  admiral:
    build: .
    image: admiral:latest
    container_name: admiral
    restart: unless-stopped
    ports:
      - "80:3031"
      - "443:3031"
    environment:
      PORT: "3031"
      NODE_ENV: production
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3031/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
